# Blondel — table machine-lisible des règles de dimensionnement (axe A.4)
# Voir docs/research/A-regles.md pour le détail, les contradictions et la liste des sources.
# Vérifié le 2026-09-28 (voir « Journal de vérification » de A-regles.md).
# Numéros de sources = références [n] de A-regles.md. Consultation : 2026-09-28.
# Unités : mm sauf mention contraire (champ `unite`).
# nature : reglementaire | normatif | metier
# severite : bloquant | avertissement | conseil
# confiance : eleve | moyen | faible
# Toutes les règles des contextes actifs s'appliquent ; la plus contraignante l'emporte.
# source_secondaire: true = valeur issue d'une norme payante NON lue (décision 2026-09-28 : pas d'achat),
#   reprise d'une source secondaire. Traitée selon le profil de conformité du projet (voir `profils`).

version: 1
date_consultation: "2026-09-28"
pays: FR

profils:
  strict: "Sévérité telle qu'indiquée pour toutes les règles (défaut)."
  souple: "Les règles `source_secondaire: true` de sévérité `bloquant` sont rétrogradées en `avertissement` ; les autres sont inchangées."

variables:
  h: "hauteur de marche (mm)"
  h_i: "hauteur de la marche i (mm)"
  h1: "hauteur de la première marche après pose, par rapport au sol fini (mm)"
  h_nom: "hauteur de marche nominale = H / n (mm)"
  g: "giron sur la ligne de foulée ou la ligne de mesure (mm)"
  g_i: "giron de la marche i (mm)"
  g_nom: "giron nominal (mm)"
  g_collet: "giron mesuré à la limite intérieure de l'emmarchement (collet), en corde (mm)"
  g_ext: "giron mesuré à l'extrémité extérieure de la marche (mm)"
  H: "hauteur à monter, sol fini à sol fini (mm)"
  n: "nombre de hauteurs de marche (contremarches) de la volée"
  E: "emmarchement, entre faces internes des limons (mm)"
  L_mc: "largeur libre entre mains courantes (mm)"
  L_passage: "largeur de passage (entre parois / garde-corps / mains courantes saillantes > 100 mm) (mm)"
  d_lf: "distance de la ligne de foulée à la rive intérieure (jour, noyau ou rampe côté intérieur) (mm)"
  e: "échappée : hauteur libre verticale au-dessus de la ligne de pente, sur la ligne de foulée (mm)"
  ep: "épaisseur du plancher haut, sol fini à sous-face (mm)"
  L_tremie: "longueur de trémie mesurée depuis le nez d'arrivée (mm)"
  R: "reculement (mm)"
  D_mc: "dégagement entre main courante et paroi (mm)"
  H_mc: "hauteur de main courante mesurée à la verticale du nez de marche (mm)"
  H_gc: "hauteur du garde-corps au-dessus de la zone d'activité / du nez de marche (mm)"
  vide: "plus grande sphère passant dans le remplissage (mm)"
  recouvrement: "recouvrement horizontal entre deux marches successives (mm)"
  debord_nez: "débord du nez de marche sur la contremarche (mm)"
  L_palier: "longueur du palier dans le sens de la marche (mm)"
  l_palier: "largeur du palier (mm)"
  alpha: "angle de pente de la volée (degrés)"
  D_fut: "diamètre du fût central d'un hélicoïdal (mm)"

contextes:
  bois_dtu: "Escalier (ou partie) en bois ou à base de bois — NF DTU 36.3 (2014)"
  logement_interieur: "Escalier intérieur d'un logement neuf (MI ou logement de BHC) — arrêté du 24/12/2015 art. 12"
  bhc_parties_communes: "Escalier des parties communes d'un bâtiment d'habitation collectif neuf — arrêté du 24/12/2015 art. 6.1"
  erp_neuf: "ERP neuf / IOP — arrêté du 20/04/2017 art. 7-1 et règlement de sécurité ERP"
  erp_existant: "ERP situé dans un cadre bâti existant — arrêté du 08/12/2014"
  erp_securite: "Tout escalier ERP destiné au public — règlement de sécurité incendie (arrêté du 25/06/1980, CO)"
  exterieur: "Escalier extérieur"
  tournant: "Volée comportant des marches balancées ou tournantes"
  helicoidal: "Escalier hélicoïdal (fût central, à jour ou sur limon)"
  gain_de_place: "Escalier gain de place / pas japonais / pas décalés"
  echelle_meunier: "Échelle de meunier (hors DTU 36.3) — analogie échelle à marches industrielle"
  industriel: "Accès technique / machines — NF EN ISO 14122-3, NF E85-015"
  garde_corps_1988: "Garde-corps selon NF P01-012 (1988) — projets antérieurs au 01/06/2025 (PC/DP) ou au 01/01/2026 (marchés)"
  garde_corps_2024: "Garde-corps selon NF P01-012 (2024)"
  tous: "Tout escalier"

regles:

  # ---------------------------------------------------------------- Module de Blondel
  - id: BLONDEL_DTU
    description: "Module 2h+g sur la ligne de foulée, escaliers bois (logements)"
    formule: "580 <= 2*h + g <= 660"
    min: 580
    max: 660
    recommande: 630
    unite: mm
    contexte: [bois_dtu]
    nature: normatif
    source: "NF DTU 36.3 P3 §6.2 via [1][4]"
    source_secondaire: true
    confiance: eleve
    severite: bloquant

  - id: BLONDEL_ERP_BHC
    description: "Module 2h+g en ERP et parties communes de BHC (borne haute 640 contestée, voir A-regles §5) — avertissement uniquement, les deux bornes (décision 2026-09-28)"
    formule: "600 <= 2*h + g <= 640"
    min: 600
    max: 640
    recommande: 630
    unite: mm
    contexte: [erp_neuf, erp_existant, bhc_parties_communes]
    nature: normatif
    source: "NF DTU 36.3 P3 selon UICB [4] ; AFEB [1] donne seulement min 600"
    source_secondaire: true
    confiance: moyen
    severite: avertissement

  - id: BLONDEL_CONFORT
    description: "Zone de confort du module 2h+g"
    formule: "600 <= 2*h + g <= 640"
    min: 600
    max: 640
    recommande: 630
    unite: mm
    contexte: [tous]
    nature: metier
    source: "[4][24][25]"
    confiance: moyen
    severite: conseil

  - id: BLONDEL_INDUSTRIEL
    description: "Module g+2h pour escaliers industriels"
    formule: "600 <= 2*h + g <= 660"
    min: 600
    max: 660
    recommande: null
    unite: mm
    contexte: [industriel]
    nature: normatif
    source: "NF EN ISO 14122-3 / NF E85-015 via [18][19][20]"
    source_secondaire: true
    confiance: moyen
    severite: bloquant

  - id: CONFORT_CLASSE
    description: "Classe de confort DTU selon h/g : confortable < 0,78 ; courant 0,78-1 ; raide 1-1,32 ; hors classe > 1,32"
    formule: "h / g <= 1.32"
    min: null
    max: 1.32
    recommande: 0.78
    unite: ratio
    contexte: [bois_dtu]
    nature: normatif
    source: "NF DTU 36.3 P3 §6.1 via [1]"
    source_secondaire: true
    confiance: eleve
    severite: avertissement

  # ---------------------------------------------------------------- Hauteur de marche
  - id: H_MAX_DTU
    description: "Hauteur de marche maximale (hors marche de départ), escaliers bois"
    formule: "h <= 210"
    min: null
    max: 210
    recommande: 175
    unite: mm
    contexte: [bois_dtu]
    nature: normatif
    source: "NF DTU 36.3 P3 §6.4 via [1][3]"
    source_secondaire: true
    confiance: eleve
    severite: bloquant

  - id: H_TOLERANCE_DTU
    description: "Écart de chaque hauteur de marche par rapport à la valeur nominale"
    formule: "abs(h_i - h_nom) <= 5"
    min: -5
    max: 5
    recommande: 0
    unite: mm
    contexte: [bois_dtu, logement_interieur, bhc_parties_communes, erp_neuf]
    nature: normatif
    source: "NF DTU 36.3 via [1][4]"
    source_secondaire: true
    confiance: eleve
    severite: avertissement

  - id: H_PREMIERE_MARCHE_TOL
    description: "Tolérance de la hauteur de la 1re marche après pose par rapport au sol fini"
    formule: "-30 <= h1 - h_nom <= 10"
    min: -30
    max: 10
    recommande: 0
    unite: mm
    contexte: [bois_dtu]
    nature: normatif
    source: "NF DTU 36.3 P1-1 §6.5.1 via [1][2][4]"
    source_secondaire: true
    confiance: eleve
    severite: avertissement

  - id: H_MAX_LOGEMENT
    description: "Hauteur de marche maximale, escalier intérieur de logement neuf"
    formule: "h <= 180"
    min: null
    max: 180
    recommande: null
    unite: mm
    contexte: [logement_interieur]
    nature: reglementaire
    source: "Arrêté 24/12/2015 art. 12 [8][4]"
    confiance: eleve
    severite: bloquant

  - id: H_MAX_BHC_PC
    description: "Hauteur de marche maximale, parties communes de BHC neufs"
    formule: "h <= 170"
    min: null
    max: 170
    recommande: null
    unite: mm
    contexte: [bhc_parties_communes]
    nature: reglementaire
    source: "Arrêté 24/12/2015 art. 6.1 [7][9][4]"
    confiance: eleve
    severite: bloquant

  - id: H_MAX_ERP_NEUF
    description: "Hauteur de marche maximale, ERP neufs"
    formule: "h <= 160"
    min: null
    max: 160
    recommande: null
    unite: mm
    contexte: [erp_neuf]
    nature: reglementaire
    source: "Arrêté 20/04/2017 art. 7-1 [5][6]"
    confiance: eleve
    severite: bloquant

  - id: H_MAX_ERP_EXISTANT
    description: "Hauteur de marche maximale, ERP existants"
    formule: "h <= 170"
    min: null
    max: 170
    recommande: null
    unite: mm
    contexte: [erp_existant]
    nature: reglementaire
    source: "Arrêté 08/12/2014 art. 7 point 7.1 [31][4] (dimensions initiales conservables sans travaux sur l'escalier)"
    confiance: eleve
    severite: bloquant

  - id: H_MAX_HELICOIDAL_DTU
    description: "Hauteur de marche maximale, escalier hélicoïdal bois (annexe A DTU, non vérifiée)"
    formule: "h <= 230"
    min: null
    max: 230
    recommande: null
    unite: mm
    contexte: [helicoidal]
    nature: normatif
    source: "NF DTU 36.3 P3 annexe A selon [24] (source unique)"
    source_secondaire: true
    confiance: faible
    severite: avertissement

  - id: H_MAX_ECHELLE_MARCHES
    description: "Hauteur de marche maximale, échelle à marches (analogie échelle de meunier)"
    formule: "h <= 250"
    min: null
    max: 250
    recommande: null
    unite: mm
    contexte: [echelle_meunier, industriel]
    nature: normatif
    source: "NF EN ISO 14122-3 / NF E85-015 via [18][19][20]"
    source_secondaire: true
    confiance: moyen
    severite: avertissement

  - id: H_CONFORT
    description: "Plage de confort usuelle de la hauteur de marche"
    formule: "160 <= h <= 180"
    min: 160
    max: 180
    recommande: 170
    unite: mm
    contexte: [tous]
    nature: metier
    source: "[24]"
    confiance: faible
    severite: conseil

  - id: H_REGULARITE
    description: "Toutes les marches d'une volée ont la même hauteur (hors 1re marche)"
    formule: "max(h_i) - min(h_i) <= 10"
    min: null
    max: 10
    recommande: 0
    unite: mm
    contexte: [tous]
    nature: normatif
    source: "Circulaire 2007-53 (fortement recommandé) + tolérance ±5 mm DTU [4][1]"
    confiance: eleve
    severite: avertissement

  # ---------------------------------------------------------------- Giron
  - id: G_MIN_DTU
    description: "Giron minimal sur la ligne de foulée, escaliers bois"
    formule: "g >= 190"
    min: 190
    max: null
    recommande: 250
    unite: mm
    contexte: [bois_dtu]
    nature: normatif
    source: "NF DTU 36.3 P3 §6.5 via [1]"
    source_secondaire: true
    confiance: eleve
