  - id: G_EXT_MAX_ERP_TOURNANT
    description: "Giron extérieur maximal des marches d'un escalier tournant d'ERP"
    formule: "g_ext < 420"
    min: null
    max: 420
    recommande: null
    unite: mm
    contexte: [erp_securite, tournant, helicoidal]
    nature: reglementaire
    source: "Règlement sécurité ERP CO 56 §2 [10]"
    confiance: eleve
    severite: bloquant

  - id: G_COLLET_MIN
    description: "Giron minimal au collet (limite intérieure de l'emmarchement) des marches balancées — usage, pas de valeur normative FR trouvée"
    formule: "g_collet >= 100"
    min: 100
    max: null
    recommande: 150
    unite: mm
    contexte: [tournant, helicoidal]
    nature: metier
    source: "[30] (usage) ; comparaisons ADK 50 mm [21], DIN 18065 50/100 mm [22]"
    confiance: faible
    severite: avertissement

  - id: G_COLLET_MONOTONE
    description: "Les girons au collet décroissent (ou restent constants) vers l'angle du tournant"
    formule: "g_collet[i] monotone vers l'angle"
    min: null
    max: null
    recommande: null
    unite: mm
    contexte: [tournant]
    nature: metier
    source: "DIN 18065 (comparaison) [22]"
    confiance: moyen
    severite: avertissement

  - id: G_BALANCE_VS_DROITE
    description: "Giron des marches balancées sur la ligne de foulée au moins égal à celui des marches droites (régularité du pas)"
    formule: "g_i(balancée) >= g_nom - 10"
    min: null
    max: null
    recommande: null
    unite: mm
    contexte: [tournant]
    nature: metier
    source: "ADK §1.27 (comparaison) [21] ; tolérance DTU ±10 mm [1]"
    confiance: moyen
    severite: avertissement

  - id: G_PROFONDEUR_ECHELLE
    description: "Profondeur de marche minimale, échelle à marches"
    formule: "g >= 80"
    min: 80
    max: null
    recommande: null
    unite: mm
    contexte: [echelle_meunier, industriel]
    nature: normatif
    source: "NF EN ISO 14122-3 via [18][19]"
    source_secondaire: true
    confiance: moyen
    severite: avertissement

  # ---------------------------------------------------------------- Ligne de foulée
  - id: LF_POSITION_DTU_ETROIT
    description: "Ligne de foulée au milieu de l'emmarchement si E <= 1200 mm"
    formule: "E <= 1200 => d_lf = E / 2"
    min: null
    max: null
    recommande: null
    unite: mm
    contexte: [bois_dtu]
    nature: normatif
    source: "NF DTU 36.3 P3 §6.3 via [1][3]"
    source_secondaire: true
    confiance: eleve
    severite: bloquant

  - id: LF_POSITION_DTU_LARGE
    description: "Ligne de foulée à 600 mm de la rampe côté intérieur si E > 1200 mm"
    formule: "E > 1200 => d_lf = 600"
    min: 600
    max: 600
    recommande: 600
    unite: mm
    contexte: [bois_dtu]
    nature: normatif
    source: "NF DTU 36.3 P3 §6.3 via [1][3]"
    source_secondaire: true
    confiance: eleve
    severite: bloquant

  - id: LF_POSITION_ERP_TOURNANT
    description: "Mesure de h et g sur la ligne de foulée à 600 mm du noyau ou du vide central (escaliers tournants ERP)"
    formule: "d_lf = 600"
    min: 600
    max: 600
    recommande: 600
    unite: mm
    contexte: [erp_securite, tournant, helicoidal]
    nature: reglementaire
    source: "Règlement sécurité ERP CO 56 §2 [10]"
    confiance: eleve
    severite: bloquant

  - id: LF_POSITION_ACCESSIBILITE
    description: "Ligne de mesure du giron en accessibilité : milieu si E <= 1200, 600 mm de la rampe intérieure sinon (logement : tolérance entre milieu et 350 mm du mur extérieur)"
    formule: "E <= 1200 => d_lf = E/2 ; E > 1200 => d_lf = 600"
    min: null
    max: null
    recommande: null
    unite: mm
    contexte: [logement_interieur, bhc_parties_communes, erp_neuf]
    nature: reglementaire
    source: "QR n°81 accessibilite-batiment.fr (classée « ancienne réglementation », reprise par l'UICB en 2020) et DTU 36.3 P3 via [4]"
    source_secondaire: true
    note: "Seule la ligne milieu / 600 mm est bloquante ; la tolérance « milieu ↔ 350 mm du mur extérieur » est une option non bloquante (SPEC X8)"
    confiance: moyen
    severite: bloquant

  - id: LF_POSITION_HELICOIDAL
    description: "Ligne de foulée d'un hélicoïdal bois à 600 mm du fût (annexe A DTU, non vérifiée)"
    formule: "d_lf = 600"
    min: 600
    max: 600
    recommande: 600
    unite: mm
    contexte: [helicoidal, bois_dtu]
    nature: normatif
    source: "[24]"
    confiance: faible
