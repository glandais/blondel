    formule: "abs(g_i - g_nom) <= 5"
    min: -5
    max: 5
    recommande: 0
    unite: mm
    contexte: [bois_dtu]
    nature: normatif
    source: "NF DTU 36.3 P3 via [1][4]"
    source_secondaire: true
    confiance: eleve
    severite: avertissement

  - id: G_TOL_BALANCEE
    description: "Tolérance du giron d'une marche balancée (sur la ligne de foulée)"
    formule: "abs(g_i - g_nom) <= 10"
    min: -10
    max: 10
    recommande: 0
    unite: mm
    contexte: [bois_dtu, tournant]
    nature: normatif
    source: "NF DTU 36.3 P3 via [1][4]"
    source_secondaire: true
    confiance: eleve
    severite: avertissement

  - id: G_MIN_LOGEMENT
    description: "Giron minimal (ligne de mesure), escalier intérieur de logement neuf"
    formule: "g >= 240"
    min: 240
    max: null
    recommande: null
    unite: mm
    contexte: [logement_interieur]
    nature: reglementaire
    source: "Arrêté 24/12/2015 art. 12 [8][4]"
    confiance: eleve
    severite: bloquant

  - id: G_MIN_BHC_PC
    description: "Giron minimal, parties communes de BHC neufs"
    formule: "g >= 280"
    min: 280
    max: null
    recommande: null
    unite: mm
    contexte: [bhc_parties_communes]
    nature: reglementaire
    source: "Arrêté 24/12/2015 art. 6.1 [7][9]"
    confiance: eleve
    severite: bloquant

  - id: G_MIN_ERP_NEUF
    description: "Giron minimal, ERP neufs"
    formule: "g >= 280"
