# Vérifie chaque pull request : types, tests, formatage et construction de l'application.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un nouveau push sur la même PR annule la vérification précédente.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Version de pnpm lue depuis le champ « packageManager » de package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check

      - name: Construction de l'application
        run: pnpm --filter @blondel/web build
        env:
          BASE_PATH: /blondel/
